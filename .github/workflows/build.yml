name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The "test" check is required on main (release.yml's flake bump PR waits for it) -- keep the job id.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # `build` runs `check`: tests, ktlintCheck and detekt. Format locally with `./gradlew ktlintFormat`.
      - name: Build, test and lint
        run: ./gradlew build
