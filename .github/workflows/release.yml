name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  # ── Build on each platform ────────────────────────────────────────────────
  # No separate verify/lint gate here — build.yml already runs tests + ktlint + detekt on
  # every push/PR to main, so by release time the commit has already passed those. The
  # per-platform smoke test below is the real functional check for a release build.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            javaArch: x64
            exe: app/build/compose/binaries/main/app/eventt/bin/eventt
            installerTask: packageDeb
            installerDir: app/build/compose/binaries/main/deb
            installerExt: deb

          - os: windows-latest
            platform: windows
            javaArch: x64
            # No bin/ subfolder here, unlike Linux/macOS — jpackage's Windows app-image puts
            # the exe directly at <packageName>/<packageName>.exe.
            exe: app/build/compose/binaries/main/app/eventt/eventt.exe
            installerTask: packageMsi
            installerDir: app/build/compose/binaries/main/msi
            installerExt: msi

          # No universal (fat) binary — jpackage/Skiko natives are tied to the JDK's arch, so
          # Intel and Apple Silicon are built and shipped separately. GitHub retired the hosted
          # Intel macOS runner, so both variants now build on the same Apple Silicon runner;
          # the x64 leg forces setup-java to install an x64 JDK, which macOS runs under Rosetta
          # 2 (preinstalled on this runner image) — Rosetta only translates the *build*, the
          # jpackage output embeds that x64 JVM and is a genuinely native Intel app. UpdateChecker
          # matches the asset filename on "macos-x64"/"macos-arm64", so these platform values
          # must stay in sync with app/src/main/kotlin/org/eventt/update/UpdateChecker.kt.
          - os: macos-26-intel
            platform: macos-x64
            javaArch: x64
            exe: app/build/compose/binaries/main/app/eventt.app/Contents/MacOS/eventt
            installerTask: packageDmg
            installerDir: app/build/compose/binaries/main/dmg
            installerExt: dmg

          - os: macos-latest
            platform: macos-arm64
            javaArch: arm64
            exe: app/build/compose/binaries/main/app/eventt.app/Contents/MacOS/eventt
            installerTask: packageDmg
            installerDir: app/build/compose/binaries/main/dmg
            installerExt: dmg

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          architecture: ${{ matrix.javaArch }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.platform }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ matrix.platform }}-

      # Skipped on workflow_dispatch (manual test runs) — jpackage needs a numeric version,
      # and a branch name like "main" isn't one, so those runs keep gradle.properties' default.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # -i.bak (suffix glued to -i, no space) is the one form both GNU sed (Linux/Windows
          # git-bash) and BSD sed (macOS) accept — a bare `-i "script"` makes BSD sed treat the
          # script as the backup suffix and fail.
          sed -i.bak "s/^app\.version=.*/app.version=$VERSION/" gradle.properties
          rm -f gradle.properties.bak
          echo "Building version $VERSION"

      - name: Build distributable
        shell: bash
        run: ./gradlew createDistributable

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 1
          DISPLAY=:99 ${{ matrix.exe }} &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Smoke test passed"
            kill $PID
          else
            echo "❌ App exited unexpectedly"
            exit 1
          fi

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "${{ matrix.exe }}" -PassThru
          Start-Sleep -Seconds 8
          if (-not $proc.HasExited) {
            Write-Host "✅ Smoke test passed"
            Stop-Process -Id $proc.Id -Force
          } else {
            Write-Host "❌ App exited with code $($proc.ExitCode)"
            exit 1
          }

      - name: Smoke test (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          ${{ matrix.exe }} &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Smoke test passed"
            kill $PID
          else
            echo "❌ App exited unexpectedly"
            exit 1
          fi

      # ── Package zip for auto-updater ───────────────────────────────────────
      - name: Package zip (Linux / macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd app/build/compose/binaries/main/app
          zip -r "$GITHUB_WORKSPACE/eventt-${{ matrix.platform }}.zip" .

      - name: Package zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/compose/binaries/main/app/* `
            -DestinationPath eventt-windows.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: eventt-${{ matrix.platform }}
          path: eventt-${{ matrix.platform }}.zip
          retention-days: 1

      # ── Native installer (.deb / .msi / .dmg) ───────────────────────────────
      - name: Build native installer
        shell: bash
        run: ./gradlew ${{ matrix.installerTask }}

      - name: Rename installer
        shell: bash
        run: |
          src=$(find "${{ matrix.installerDir }}" -maxdepth 1 -name "*.${{ matrix.installerExt }}" | head -n1)
          cp "$src" "eventt-${{ matrix.platform }}.${{ matrix.installerExt }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: eventt-${{ matrix.platform }}-installer
          path: eventt-${{ matrix.platform }}.${{ matrix.installerExt }}
          retention-days: 1

      # ── Fat jar (run anywhere with `java -jar`, one per OS — bundled native
      #    Skiko libs are platform-specific) ───────────────────────────────────
      - name: Build jar
        shell: bash
        run: ./gradlew :app:shadowJar

      - name: Rename jar
        shell: bash
        run: cp app/build/libs/eventt-*.jar "eventt-${{ matrix.platform }}.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: eventt-${{ matrix.platform }}-jar
          path: eventt-${{ matrix.platform }}.jar
          retention-days: 1

  # ── Create GitHub Release ─────────────────────────────────────────────────
  # Skipped on workflow_dispatch (manual test runs) — only real tag pushes publish a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full tag history to diff the previous tag against this one —
          # the default shallow (depth-1) checkout only has this single commit.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "EVE Night Trade Tools $GITHUB_REF_NAME" \
            --notes-file "${{ steps.cliff.outputs.changelog }}" \
            artifacts/eventt-linux/eventt-linux.zip \
            artifacts/eventt-windows/eventt-windows.zip \
            artifacts/eventt-macos-x64/eventt-macos-x64.zip \
            artifacts/eventt-macos-arm64/eventt-macos-arm64.zip \
            artifacts/eventt-linux-installer/eventt-linux.deb \
            artifacts/eventt-windows-installer/eventt-windows.msi \
            artifacts/eventt-macos-x64-installer/eventt-macos-x64.dmg \
            artifacts/eventt-macos-arm64-installer/eventt-macos-arm64.dmg \
            artifacts/eventt-linux-jar/eventt-linux.jar \
            artifacts/eventt-windows-jar/eventt-windows.jar \
            artifacts/eventt-macos-x64-jar/eventt-macos-x64.jar \
            artifacts/eventt-macos-arm64-jar/eventt-macos-arm64.jar

      # ── Keep flake.nix in sync with the release ─────────────────────────────
      # flake.nix pins version + the fetchzip output hash of eventt-linux.zip so the
      # Nix package build stays fully hermetic (no local gradlew, no --impure). Both
      # values only change on a real release tag, so this bumps them here instead of
      # requiring a manual edit before every release.
      - uses: cachix/install-nix-action@v31

      # main requires the "test" status check (see build.yml), which blocks a bare `git push`
      # of an unchecked commit even from Actions — so this opens a PR and lets it auto-merge
      # once that check runs and passes, instead of pushing straight to main.
      - name: Update flake.nix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH=$(nix hash convert --hash-algo sha256 --to sri \
            "$(nix-prefetch-url --unpack --type sha256 \
              "file://$(pwd)/artifacts/eventt-linux/eventt-linux.zip" 2>/dev/null | tail -1)")

          sed -i \
            -e "s|version = \"[0-9.]*\";|version = \"$VERSION\";|" \
            -e "s|/download/v[0-9.]*/eventt-linux.zip|/download/$GITHUB_REF_NAME/eventt-linux.zip|" \
            -e "s|hash = \"sha256-[^\"]*\";|hash = \"$HASH\";|" \
            flake.nix

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git diff --staged --quiet && exit 0

          BRANCH="flake-bump-$GITHUB_REF_NAME"
          git checkout -b "$BRANCH"
          git commit -m "flake: bump to $GITHUB_REF_NAME"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "flake: bump to $GITHUB_REF_NAME" \
            --body "Automated flake.nix version/hash bump for $GITHUB_REF_NAME."
          gh pr merge "$BRANCH" --auto --squash
