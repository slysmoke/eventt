name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  # ── Tests + linters gate the whole release — nothing packages until this passes ────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-linux-

      - name: Run tests
        run: ./gradlew test

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

  # ── Build on each platform ────────────────────────────────────────────────
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            exe: app/build/compose/binaries/main/app/eventt/bin/eventt
            installerTask: packageDeb
            installerDir: app/build/compose/binaries/main/deb
            installerExt: deb

          - os: windows-latest
            platform: windows
            # No bin/ subfolder here, unlike Linux/macOS — jpackage's Windows app-image puts
            # the exe directly at <packageName>/<packageName>.exe.
            exe: app/build/compose/binaries/main/app/eventt/eventt.exe
            installerTask: packageMsi
            installerDir: app/build/compose/binaries/main/msi
            installerExt: msi

          - os: macos-latest
            platform: macos
            exe: app/build/compose/binaries/main/app/eventt.app/Contents/MacOS/eventt
            installerTask: packageDmg
            installerDir: app/build/compose/binaries/main/dmg
            installerExt: dmg

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.platform }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ matrix.platform }}-

      # Skipped on workflow_dispatch (manual test runs) — jpackage needs a numeric version,
      # and a branch name like "main" isn't one, so those runs keep gradle.properties' default.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # -i.bak (suffix glued to -i, no space) is the one form both GNU sed (Linux/Windows
          # git-bash) and BSD sed (macOS) accept — a bare `-i "script"` makes BSD sed treat the
          # script as the backup suffix and fail.
          sed -i.bak "s/^app\.version=.*/app.version=$VERSION/" gradle.properties
          rm -f gradle.properties.bak
          echo "Building version $VERSION"

      - name: Build distributable
        shell: bash
        run: ./gradlew createDistributable

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get install -y xvfb > /dev/null
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 1
          DISPLAY=:99 ${{ matrix.exe }} &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Smoke test passed"
            kill $PID
          else
            echo "❌ App exited unexpectedly"
            exit 1
          fi

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "${{ matrix.exe }}" -PassThru
          Start-Sleep -Seconds 8
          if (-not $proc.HasExited) {
            Write-Host "✅ Smoke test passed"
            Stop-Process -Id $proc.Id -Force
          } else {
            Write-Host "❌ App exited with code $($proc.ExitCode)"
            exit 1
          }

      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        run: |
          ${{ matrix.exe }} &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✅ Smoke test passed"
            kill $PID
          else
            echo "❌ App exited unexpectedly"
            exit 1
          fi

      # ── Package zip for auto-updater ───────────────────────────────────────
      - name: Package zip (Linux / macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cd app/build/compose/binaries/main/app
          zip -r "$GITHUB_WORKSPACE/eventt-${{ matrix.platform }}.zip" .

      - name: Package zip (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path app/build/compose/binaries/main/app/* `
            -DestinationPath eventt-windows.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventt-${{ matrix.platform }}
          path: eventt-${{ matrix.platform }}.zip
          retention-days: 1

      # ── Native installer (.deb / .msi / .dmg) ───────────────────────────────
      - name: Build native installer
        shell: bash
        run: ./gradlew ${{ matrix.installerTask }}

      - name: Rename installer
        shell: bash
        run: |
          src=$(find "${{ matrix.installerDir }}" -maxdepth 1 -name "*.${{ matrix.installerExt }}" | head -n1)
          cp "$src" "eventt-${{ matrix.platform }}.${{ matrix.installerExt }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventt-${{ matrix.platform }}-installer
          path: eventt-${{ matrix.platform }}.${{ matrix.installerExt }}
          retention-days: 1

      # ── Fat jar (run anywhere with `java -jar`, one per OS — bundled native
      #    Skiko libs are platform-specific) ───────────────────────────────────
      - name: Build jar
        shell: bash
        run: ./gradlew :app:shadowJar

      - name: Rename jar
        shell: bash
        run: cp app/build/libs/eventt-*.jar "eventt-${{ matrix.platform }}.jar"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: eventt-${{ matrix.platform }}-jar
          path: eventt-${{ matrix.platform }}.jar
          retention-days: 1

  # ── Create GitHub Release ─────────────────────────────────────────────────
  # Skipped on workflow_dispatch (manual test runs) — only real tag pushes publish a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "EVE Night Trade Tools $GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/eventt-linux/eventt-linux.zip \
            artifacts/eventt-windows/eventt-windows.zip \
            artifacts/eventt-macos/eventt-macos.zip \
            artifacts/eventt-linux-installer/eventt-linux.deb \
            artifacts/eventt-windows-installer/eventt-windows.msi \
            artifacts/eventt-macos-installer/eventt-macos.dmg \
            artifacts/eventt-linux-jar/eventt-linux.jar \
            artifacts/eventt-windows-jar/eventt-windows.jar \
            artifacts/eventt-macos-jar/eventt-macos.jar
