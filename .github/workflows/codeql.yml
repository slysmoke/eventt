name: CodeQL

# Nix packaging (the release bot's flake bump) has nothing to analyse. Only CodeQL skips it:
# CI's "test" check is required on main, so build.yml must still run for the bot's PR.
on:
  push:
    branches: [main]
    paths-ignore: ['flake.nix', 'flake.lock']
  pull_request:
    branches: [main]
    paths-ignore: ['flake.nix', 'flake.lock']
  schedule:
    - cron: '39 21 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL traces the compiler, so every source must really be compiled here: no build cache,
      # no Kotlin daemon (it compiles outside the traced process).
      - if: matrix.language == 'java-kotlin'
        run: ./gradlew classes testClasses --no-daemon --no-build-cache --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}
