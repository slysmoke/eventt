name: Nightly

# Every push to main rebuilds the Linux app-image into the rolling "nightly" pre-release and
# force-pushes a `nightly` branch (main + one commit) whose flake.nix points at it, for
# `github:slysmoke/eventt/nightly`. main's flake.nix stays on the last tagged release.
# The updater reads /releases/latest, which never returns a pre-release.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # jpackage needs a numeric version. Use the latest release's, so the in-app updater
      # doesn't see the nightly as older than it.
      - name: Set version from latest release
        run: |
          VERSION=$(gh release view --json tagName -q .tagName)
          VERSION=${VERSION#v}
          sed -i "s/^app\.version=.*/app.version=$VERSION/" gradle.properties
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build distributable
        run: ./gradlew createDistributable

      - name: Package zip
        run: |
          cd app/build/compose/binaries/main/app
          zip -qr "$GITHUB_WORKSPACE/eventt-linux.zip" .

      - name: Upload to the nightly pre-release
        run: |
          gh release view nightly >/dev/null 2>&1 || gh release create nightly --prerelease \
            --target "$GITHUB_SHA" --title "Nightly" \
            --notes "Rolling build of the latest main commit, for the Nix flake's nightly branch."
          gh release upload nightly eventt-linux.zip --clobber

      - uses: cachix/install-nix-action@v31

      - name: Push the nightly branch
        run: |
          HASH=$(nix hash convert --hash-algo sha256 --to sri \
            "$(nix-prefetch-url --unpack --type sha256 \
              "file://$(pwd)/eventt-linux.zip" 2>/dev/null | tail -1)")
          SHORT=${GITHUB_SHA::7}

          git checkout -- gradle.properties
          sed -i \
            -e "s|version = \"[0-9.]*\";|version = \"$VERSION-nightly-$SHORT\";|" \
            -e "s|/download/v[0-9.]*/eventt-linux.zip|/download/nightly/eventt-linux.zip|" \
            -e "s|hash = \"sha256-[^\"]*\";|hash = \"$HASH\";|" \
            flake.nix

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "flake: nightly $SHORT"
          git push -f origin HEAD:refs/heads/nightly
